---
# 1. Handle Query Store Configuration
- name: Ensure Query Store is configured correctly
  community.general.mssql_script:
    login_user: "{{ admin_user }}"
    login_password: "{{ admin_password }}"
    login_host: "{{ inventory_hostname }}"
    db: "{{ db_name }}"
    # We use 'lookup' to read the template file directly into the script parameter
    script: "{{ lookup('template', 'query_store.sql.j2') }}"
  register: sql_config_query_store_result
  delegate_to: localhost
  changed_when:
    - sql_config_query_store_result.query_results is defined
    - "'CHANGED' in sql_config_query_store_result.query_results[0]"

# 2. Handle Database User Provisioning
- name: Ensure Contained Database User is provisioned
  community.general.mssql_script:
    login_user: "{{ admin_user }}"
    login_password: "{{ admin_password }}"
    login_host: "{{ inventory_hostname }}"
    db: "{{ db_name }}"
    script: "{{ lookup('template', 'provision_user.sql.j2') }}"
  register: sql_config_user_creation_result
  delegate_to: localhost
  changed_when:
    - sql_config_user_creation_result.query_results is defined
    - "'CHANGED' in sql_config_user_creation_result.query_results[0]"

# 3. Handle Deployment Auditing
- name: Ensure Deployment Audit Table and Record
  community.general.mssql_script:
    login_user: "{{ admin_user }}"
    login_password: "{{ admin_password }}"
    login_host: "{{ inventory_hostname }}"
    db: "{{ db_name }}"
    script: "{{ lookup('template', 'deployment_audit.sql.j2') }}"
  delegate_to: localhost
