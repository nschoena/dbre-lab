name: DBRE Lab Deployment

on:
  push:
    branches: [ "feature/github-actions", "main" ]

# These environment variables link your GitHub Secrets to the Runner
env:
  # Azure Authentication
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  # Terraform Variables
  TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
  TF_VAR_my_home_ip: ${{ secrets.MY_HOME_IP }}

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Dev Terraform Init
        run: terraform init
        working-directory: ./terraform/environments/dev

      - name: Dev Terraform Plan
        run: terraform plan -input=false
        working-directory: ./terraform/environments/dev

      - name: Dev Terraform Apply
        run: terraform apply -auto-approve -input=false
        working-directory: ./terraform/environments/dev        
  
  deploy-prod:
    name: "Deploy to Production"
    needs: deploy-dev
    if: github.ref == 'refs/heads/main' # Only deploy to prod from the main branch
    runs-on: ubuntu-latest
    
    # THIS LINE LINKS TO THE SETTINGS YOU JUST MADE
    environment: production
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Prod Terraform Init
        run: terraform init
        working-directory: ./terraform/environments/prod

      - name: Prod Terraform Plan
        run: terraform plan -input=false
        working-directory: ./terraform/environments/prod

      - name: Prod Terraform Apply
        run: terraform apply -auto-approve -input=false
        working-directory: ./terraform/environments/prod