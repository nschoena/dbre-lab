name: DBRE Lab Deployment

on:
  push:
    branches: [ "feature/**", "main" ] # This matches any branch that starts with "feature/" and the "main" branch

# These environment variables link your GitHub Secrets to the Runner
env:
  # Azure Authentication
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  DEV_SQL_FQDN: "" # This will be set dynamically after Terraform applies the dev environment
  DEV_SQL_DB_NAME: "" # This will be set dynamically after Terraform applies the dev environment

  # Terraform Variables
  TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
  TF_VAR_my_home_ip: ${{ secrets.MY_HOME_IP }}

jobs:
  deploy-dev:
    name: "Provision & Configure Dev"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      # --- INFRASTRUCTURE PHASE ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Dev Terraform Init
        run: terraform init
        working-directory: ./terraform/environments/dev

      - name: Dev Terraform Plan
        run: terraform plan -input=false
        working-directory: ./terraform/environments/dev

      - name: Dev Terraform Apply
        run: |
          terraform apply -auto-approve -input=false
          echo "DEV_SQL_FQDN=$(terraform output -raw dev_sql_server_fqdn)" >> $GITHUB_ENV
          echo "DEV_SQL_DB_NAME=$(terraform output -raw dev_sql_database_name)" >> $GITHUB_ENV
        working-directory: ./terraform/environments/dev        
 
      # --- CONFIGURATION PHASE ---
      - name: Install SQL Drivers and Ansible
        run: |
          # 1. Add Microsoft's repository for the ODBC Driver
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          
          sudo apt-get update
          # 2. Install Python pip, system headers, and the Microsoft ODBC Driver
          sudo ACCEPT_EULA=Y apt-get install -y unixodbc-dev msodbcsql18
          
          # 3. Install Python libraries and Ansible
          # We use --upgrade to ensure we have the latest pip for pyodbc compatibility
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user pyodbc ansible

          # 4. Add the user pip directory to the PATH for the rest of the job
          echo "$HOME/.local/bin" >> $GITHUB_PATH
  
      - name: Run Ansible Playbook
        run: |
          ansible-playbook ansible/configure_dev_sql.yml \
            -i "${{ env.DEV_SQL_FQDN }}," \
            --extra-vars "admin_user=${{ secrets.SQL_ADMIN_USER }} \
                          admin_password=${{ secrets.SQL_ADMIN_PASSWORD }} \
                          contained_user_name=${{ secrets.DEV_CONTAINED_USER }} \
                          contained_user_password=${{ secrets.DEV_CONTAINED_PASSWORD }} \
                          db_name=${{ env.DEV_SQL_DB_NAME }}"

  deploy-prod:
    name: "Deploy to Production"
    needs: deploy-dev
    if: github.ref == 'refs/heads/main' # Only deploy to prod from the main branch
    runs-on: ubuntu-latest
    
    # THIS LINE LINKS TO THE SETTINGS YOU JUST MADE
    environment: production
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Prod Terraform Init
        run: terraform init
        working-directory: ./terraform/environments/prod

      - name: Prod Terraform Plan
        run: terraform plan -input=false
        working-directory: ./terraform/environments/prod

      - name: Prod Terraform Apply
        run: terraform apply -auto-approve -input=false
        working-directory: ./terraform/environments/prod